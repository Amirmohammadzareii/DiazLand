{% extends "base.html" %}
{% block title %}ورود شهروند — دیازلند{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8 fade-up">
  <div class="card p-8">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🔑</div>
      <h1 class="text-2xl font-bold gold">ورود شهروند</h1>
      <p class="text-gray-500 text-sm mt-1">کنترل مرزی جمهوری دیازلند</p>
    </div>

    {% if error %}
    <div class="bg-red-900/30 border border-red-700 text-red-300 rounded-lg p-3 mb-4 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1">نام کاربری</label>
        <input name="username" required
               class="w-full bg-[#0b0f19] border border-gray-700 rounded-lg px-4 py-3 focus:border-[#f5c542] focus:outline-none transition">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">رمز عبور</label>
        <input name="password" type="password" required
               class="w-full bg-[#0b0f19] border border-gray-700 rounded-lg px-4 py-3 focus:border-[#f5c542] focus:outline-none transition">
      </div>
      <button type="submit" class="btn-gold w-full py-3 text-lg">ورود به کشور</button>
    </form>

    <p class="text-center text-gray-500 text-sm mt-6">
      هنوز شهروند نشدی؟
      <a href="/register" class="gold hover:underline">درخواست تابعیت</a>
    </p>
  </div>
</div>
{% endblock %}
