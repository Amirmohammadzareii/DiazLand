{# partial پرچم دیازلند — با پارامتر سایز #}
{# استفاده: {% include "partials/flag.html" %} یا با ست کردن flag_w/flag_h قبل از include #}
{% set fw = flag_w | default(120) %}
{% set fh = flag_h | default(80) %}
<svg class="dz-flag" width="{{ fw }}" height="{{ fh }}" viewBox="0 0 600 400"
     preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-label="پرچم جمهوری دیازلند">
  <defs>
    <linearGradient id="goldGrad{{ fw }}" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="glow{{ fw }}" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="#0b1d3a"/>
  <polygon points="600,0 600,400 200,200" fill="url(#goldGrad{{ fw }})"/>
  <g filter="url(#glow{{ fw }})">
    <polygon fill="#ffffff"
      points="230,120 244,162 289,162 253,188 266,230 230,204 194,230 207,188 171,162 216,162"/>
  </g>
  <g fill="#ffffff" opacity="0.95">
    <polygon points="150,255 153,264 162,264 155,270 158,279 150,273 142,279 145,270 138,264 147,264"/>
    <polygon points="185,270 188,279 197,279 190,285 193,294 185,288 177,294 180,285 173,279 182,279"/>
    <polygon points="222,280 225,289 234,289 227,295 230,304 222,298 214,304 217,295 210,289 219,289"/>
    <polygon points="260,285 263,294 272,294 265,300 268,309 260,303 252,309 255,300 248,294 257,294"/>
    <polygon points="298,280 301,289 310,289 303,295 306,304 298,298 290,304 293,295 286,289 295,289"/>
    <polygon points="335,270 338,279 347,279 340,285 343,294 335,288 327,294 330,285 323,279 332,279"/>
    <polygon points="370,255 373,264 382,264 375,270 378,279 370,273 362,279 365,270 358,264 367,264"/>
  </g>
</svg>
